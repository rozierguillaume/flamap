name: deploy

on:
  # Toutes les 2 h. Décalé de 17 min : les tâches planifiées à l'heure ronde
  # partent dans une file d'attente saturée et démarrent avec du retard.
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois, sans annuler celui qui est en cours de publication.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La génération nationale prend quelques minutes : quatre flux FIRMS,
      # trois requêtes EFFIS et les grilles Open-Meteo séquentielles. Les 25 min
      # laissent une large marge aux reprises HTTP 429 et au WFS parfois lent.
      # Si une source indispensable reste indisponible, le script lève et le
      # job échoue ; une grille fine seule se dégrade vers le vent national.
      # Le site déjà en ligne reste intact plutôt que publier une carte vide.
      - name: Récupérer les données
        run: python3 fetch_fires.py
        timeout-minutes: 25

      # Garde-fou : sans foyers, la page planterait au premier cran.
      - name: Vérifier les données
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          manifest = json.load(open('data/manifest.json'))
          timeline = json.load(open('data/timeline.json'))
          zone_paths = list(pathlib.Path('data/zones').glob('*.json'))
          expected = {f"{zone_id}.json" for zone_id in manifest['zones']}
          actual = {path.name for path in zone_paths}
          print(f"{manifest['hotspot_count']} foyers, {manifest['dated_count']} "
                f"polygones datés, {len(zone_paths)} zones")
          if not manifest['hotspot_count'] or not timeline or actual != expected:
              sys.exit("export national incomplet, déploiement annulé")
          fine = set(manifest['fine_wind_zones'])
          for path in zone_paths:
              zone = json.load(open(path))
              if zone.get('id') != path.stem:
                  sys.exit(f"identifiant de zone incohérent : {path}")
              if path.stem in fine and not zone.get('wind'):
                  sys.exit(f"vent fin absent : {path}")
          PY

      - name: Assembler le site
        run: |
          mkdir -p _site/data
          cp index.html og.png robots.txt _site/
          cp data/manifest.json data/overview_hotspots.geojson \
             data/burnt_recent.geojson data/timeline.json \
             data/wind_coarse.json _site/data/
          cp -r data/zones _site/data/

      # Pages accepte jusqu'à 1 Go, mais Flamap doit rester très en dessous.
      # Le seuil de 100 Mio laisse plus de cinq fois le volume actuel tout en
      # bloquant une croissance accidentelle avant la création de l'artefact.
      - name: Vérifier la taille du site
        run: |
          python3 - <<'PY'
          import pathlib, sys
          root = pathlib.Path('_site')
          files = [path for path in root.rglob('*') if path.is_file()]
          size = sum(path.stat().st_size for path in files)
          largest = max(files, key=lambda path: path.stat().st_size)
          print(f"{len(files)} fichiers, {size / 1024 / 1024:.1f} Mio "
                f"(plus gros : {largest}, {largest.stat().st_size / 1024 / 1024:.1f} Mio)")
          if size > 100 * 1024 * 1024:
              sys.exit("site supérieur à 100 Mio, déploiement annulé")
          PY

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
