name: deploy

on:
  # Toutes les 2 h. Décalé de 17 min : les tâches planifiées à l'heure ronde
  # partent dans une file d'attente saturée et démarrent avec du retard.
  schedule:
    - cron: "17 */2 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois, sans annuler celui qui est en cours de publication.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ~6 s depuis un runner : le WFS d'EFFIS, très lent depuis une connexion
      # résidentielle (40 à 250 s), répond quasi instantanément en datacenter.
      # Si une source est indisponible, le script lève et le job échoue — le
      # site déjà en ligne reste intact, ce qui vaut mieux qu'une carte vide.
      - name: Récupérer les données
        run: python3 fetch_fires.py
        timeout-minutes: 25

      # Garde-fou : sans foyers, la page planterait au premier cran.
      - name: Vérifier les données
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          manifest = json.load(open('data/manifest.json'))
          timeline = json.load(open('data/timeline.json'))
          zones = list(pathlib.Path('data/zones').glob('*.json'))
          print(f"{manifest['hotspot_count']} foyers, {manifest['dated_count']} "
                f"polygones datés, {len(zones)} zones")
          if not manifest['hotspot_count'] or not timeline or len(zones) != len(manifest['zones']):
              sys.exit("export national incomplet, déploiement annulé")
          PY

      - name: Assembler le site
        run: |
          mkdir -p _site/data
          cp index.html og.png robots.txt _site/
          cp data/manifest.json data/overview_hotspots.geojson \
             data/burnt_recent.geojson data/timeline.json \
             data/wind_coarse.json _site/data/
          cp -r data/zones _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
