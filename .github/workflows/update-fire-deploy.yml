# Foyers, périmètres, vent national et vent fin des cellules actives.
name: update-fire-deploy

on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths:
      - fetch_fires.py
      - flamap/**
      - scripts/download_live_artifact.py
      - scripts/archive_push.py
      - scripts/assemble_site.py
      - scripts/validate_export.py
      - .github/workflows/update-fire-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Les trois workflows partagent ce verrou : Pages remplace l'artefact entier.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LIVE_SITE: https://flamap.fr
    outputs:
      deploy: ${{ steps.collect.outputs.deploy }}
      fresh: ${{ steps.diff.outputs.fresh }}
      message: ${{ steps.diff.outputs.message }}
    steps:
      - uses: actions/checkout@v5

      # Trois tentatives 0/3/9 s, 12 zones concurrentes ; la reprise prépare
      # également prev/ pour la notification Telegram.
      - name: Reprendre l'historique FIRMS publié
        run: python3 scripts/download_live_artifact.py --mode history

      # thermal.json est produit par le workflow météo et reste facultatif.
      - name: Reprendre la grille de température publiée
        run: python3 scripts/download_live_artifact.py --mode thermal

      - name: Récupérer les données
        id: collect
        shell: bash
        run: |
          set +e
          python3 -u fetch_fires.py
          status=$?
          set -e
          if [ "$status" -eq 75 ]; then
            echo "::warning::Tous les flux FIRMS sont indisponibles ; le site publié est conservé."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
        timeout-minutes: 25

      - name: Vérifier les données
        if: steps.collect.outputs.deploy == 'true'
        run: python3 scripts/validate_export.py fire-data data

      # L'archive est un enrichissement hors du site : son indisponibilité ne
      # doit jamais retarder la publication des foyers. Le lot reste dans les
      # journaux du job et la fusion suivante rattrapera ce qui manque, chaque
      # ligne portant son empreinte de contenu.
      - name: Archiver la collecte
        if: steps.collect.outputs.deploy == 'true'
        continue-on-error: true
        env:
          ARCHIVE_HOST: ${{ secrets.ARCHIVE_SSH_HOST }}
          ARCHIVE_USER: ${{ secrets.ARCHIVE_SSH_USER }}
          ARCHIVE_KEY: ${{ secrets.ARCHIVE_SSH_KEY }}
          ARCHIVE_KNOWN_HOSTS: ${{ secrets.ARCHIVE_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ARCHIVE_HOST:-}" ] || [ -z "${ARCHIVE_KEY:-}" ]; then
            echo "::warning::Secrets d'archive absents, collecte non archivée."
            exit 0
          fi
          python3 scripts/archive_push.py --data data --outbox outbox \
            --run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          lot=$(ls -1 outbox | head -n 1)
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ARCHIVE_KEY" > "$HOME/.ssh/archive_key"
          chmod 600 "$HOME/.ssh/archive_key"
          printf '%s\n' "$ARCHIVE_KNOWN_HOSTS" > "$HOME/.ssh/archive_known_hosts"
          # `rsync -e` découpe cette chaîne lui-même et n'appelle aucun shell :
          # un `~` y resterait littéral et la clé serait introuvable.
          ssh_cmd="ssh -i $HOME/.ssh/archive_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/archive_known_hosts -o BatchMode=yes"
          # Deux passes : le manifeste part seul, en dernier. Sans cet ordre le
          # serveur pourrait fusionner un lot dont les fichiers sont encore en
          # cours de transfert, et le croire complet.
          rsync -rt --exclude meta.json -e "$ssh_cmd" \
            "outbox/$lot/" "$ARCHIVE_USER@$ARCHIVE_HOST:$lot/"
          rsync -t -e "$ssh_cmd" \
            "outbox/$lot/meta.json" "$ARCHIVE_USER@$ARCHIVE_HOST:$lot/meta.json"
          echo "lot $lot expédié"

      - name: Comparer aux données publiées
        id: diff
        if: steps.collect.outputs.deploy == 'true'
        run: python3 notify_telegram.py --prev prev --data data

      - name: Assembler le site
        if: steps.collect.outputs.deploy == 'true'
        run: python3 scripts/assemble_site.py fire

      - name: Vérifier la taille du site
        if: steps.collect.outputs.deploy == 'true'
        run: python3 scripts/validate_export.py size _site

      - uses: actions/upload-pages-artifact@v3
        if: steps.collect.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: [build, deploy]
    if: needs.build.outputs.fresh == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publier sur Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE: ${{ needs.build.outputs.message }}
        shell: bash
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Secrets Telegram absents, message non envoyé."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" -d parse_mode=HTML \
            -d link_preview_options='{"is_disabled":true}' \
            --data-urlencode "text=$MESSAGE" -o response.json
          python3 -c "import json;print(json.load(open('response.json'))['ok'])"
