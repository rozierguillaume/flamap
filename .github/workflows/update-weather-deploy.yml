# Grille de température à 20 km, et rien d'autre.
name: update-weather-deploy

on:
  schedule:
    - cron: "47 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LIVE_SITE: https://flamap.fr
    outputs:
      deploy: ${{ steps.collect.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5
      - name: Collecter la grille de température
        id: collect
        shell: bash
        run: |
          set +e
          python3 -u fetch_fires.py --thermal
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Grille de température indisponible ; le site publié est conservé."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
        timeout-minutes: 12
      - name: Vérifier la grille
        if: steps.collect.outputs.deploy == 'true'
        run: python3 scripts/validate_export.py thermal-data data
      - name: Reprendre le site publié
        if: steps.collect.outputs.deploy == 'true'
        run: python3 scripts/download_live_artifact.py --mode weather
      - name: Remplacer la grille de température
        if: steps.collect.outputs.deploy == 'true'
        run: python3 scripts/assemble_site.py weather
      - name: Vérifier l’artefact
        if: steps.collect.outputs.deploy == 'true'
        run: python3 scripts/validate_export.py weather _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.collect.outputs.deploy == 'true'
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
