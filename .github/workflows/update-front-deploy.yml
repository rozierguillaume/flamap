# Publication rapide des seuls fichiers de front, sans interroger aucune source.
name: update-front-deploy

on:
  push:
    branches: [main]
    paths:
      - index.html
      - css/**
      - js/**
      - vendor/**
      - fonts/**
      - mentions-legales.html
      - social.html
      - og.png
      - favicon.svg
      - favicon.ico
      - apple-touch-icon.png
      - icon-192.png
      - icon-512.png
      - site.webmanifest
      - robots.txt
      - sitemap.xml
      - .github/workflows/update-front-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    env:
      LIVE_SITE: https://flamap.fr
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Vérifier que le push ne concerne que le front
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          head="${{ github.sha }}"
          if [[ "$before" = 0000000000000000000000000000000000000000 ]]; then
            changed="$(git show --format= --name-only "$head")"
          else
            changed="$(git diff --name-only "$before" "$head")"
          fi
          other="$(printf '%s\n' "$changed" | grep -Ev '^(index\.html|css/.*|js/.*|vendor/.*|fonts/.*|mentions-legales\.html|social\.html|og\.png|favicon\.svg|favicon\.ico|apple-touch-icon\.png|icon-192\.png|icon-512\.png|site\.webmanifest|robots\.txt|sitemap\.xml|\.github/workflows/update-front-deploy\.yml|scripts/benchmark_lot0\.html|docs/refactor/.*)$' || true)"
          if [ -n "$other" ]; then
            echo "Push mixte : le déploiement complet publiera aussi le front."
            printf '%s\n' "$other"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Reprendre les données publiées
        if: steps.scope.outputs.deploy == 'true'
        run: python3 scripts/download_live_artifact.py --mode front
      - name: Remplacer le front
        if: steps.scope.outputs.deploy == 'true'
        run: python3 scripts/assemble_site.py front
      - name: Vérifier l’artefact
        if: steps.scope.outputs.deploy == 'true'
        run: python3 scripts/validate_export.py front _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.scope.outputs.deploy == 'true'
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
