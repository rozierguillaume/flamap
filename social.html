<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Flamap — préparer une publication</title>
<meta name="theme-color" content="#0d0f12">
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="preload" href="/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face {
    font-family: "Instrument Sans";
    src: url("/fonts/instrument-sans-latin.woff2") format("woff2");
    font-style: normal;
    font-weight: 400 700;
    font-display: swap;
  }
  :root {
    color-scheme: dark;
    --bg: #0d0f12;
    --panel: #171a1e;
    --panel-2: #1e2227;
    --ink: #e8e6e3;
    --dim: #a8a29c;
    --line: #363a40;
    --hot: #ff6b1a;
    --front: #ffd84d;
    --recent: #b1341f;
    --ok: #9bcf9d;
    font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg);
  }
  button, textarea { font: inherit; }
  a { color: inherit; }
  header {
    width: min(1180px, calc(100% - 32px)); margin: 0 auto;
    min-height: 68px; display: flex; align-items: center;
    justify-content: space-between; gap: 24px;
  }
  .brand { display: flex; align-items: center; gap: 9px; text-decoration: none; }
  .mark { display: block; width: 38px; height: auto; flex: 0 0 auto; }
  .brand strong {
    font-size: 22px; line-height: 1; letter-spacing: -.04em; color: var(--hot);
    font-variation-settings: "wdth" 95, "wght" 700;
    font-feature-settings: "ss02" 1;
  }
  .brand strong span { color: var(--ink); }
  header > a { color: var(--dim); font-size: 13px; text-underline-offset: 3px; }
  main {
    width: min(1180px, calc(100% - 32px)); margin: 24px auto 48px;
  }
  .layout { display: grid; grid-template-columns: minmax(0, 1.68fr) minmax(290px, .72fr);
            gap: 30px; align-items: start; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9;
           border: 1px solid var(--line); border-radius: 12px; background: #111317; }
  .editor { padding-top: 2px; }
  .field + .field { margin-top: 18px; }
  .field-head { display: flex; justify-content: space-between; gap: 12px;
                margin-bottom: 7px; font-size: 12px; }
  .field-head span:last-child { color: var(--dim); font-variant-numeric: tabular-nums; }
  textarea {
    display: block; width: 100%; resize: vertical; min-height: 138px;
    padding: 12px 13px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 9px; line-height: 1.45;
  }
  textarea:focus { outline: 2px solid color-mix(in srgb, var(--hot) 72%, white);
                   outline-offset: 2px; }
  #alt { min-height: 108px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
  button {
    min-height: 42px; border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 12px; color: var(--ink); background: var(--panel);
    cursor: pointer; font-weight: 600;
  }
  button:hover { border-color: #646970; }
  button:focus-visible { outline: 2px solid var(--front); outline-offset: 2px; }
  #download { border-color: transparent; color: #1b1108;
              background: linear-gradient(135deg, var(--front), var(--hot)); }
  #status { min-height: 18px; margin: 10px 0 0; color: var(--ok);
            font-size: 13px; text-align: center; }
  #loading { padding: 24px 0; color: var(--dim); }
  #error { padding: 24px 0; color: #ffb6a1; line-height: 1.5; }
  [hidden] { display: none !important; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  @media (max-width: 820px) {
    header, main { width: min(100% - 24px, 680px); }
    main { margin-top: 16px; }
    .layout { grid-template-columns: 1fr; }
  }
  @media (max-width: 430px) {
    .actions { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <a class="brand" href="/" aria-label="Flamap, retour à la carte">
    <svg class="mark" viewBox="0 0 36 34" aria-hidden="true" focusable="false">
      <circle cx="19" cy="13" r="7" fill="#ffd84d"/>
      <circle cx="9" cy="22" r="5" fill="#ff6b1a"/>
      <circle cx="27" cy="25" r="5.2" fill="#b1341f"/>
      <circle cx="8.5" cy="6.5" r="1.6" fill="#ffd84d"/>
      <circle cx="25" cy="3.5" r="1.4" fill="#b1341f"/>
      <circle cx="34" cy="11.5" r="1.5" fill="#b1341f"/>
      <circle cx="2" cy="29.5" r="1.4" fill="#ff6b1a"/>
      <circle cx="17" cy="31.5" r="1.5" fill="#ffd84d"/>
      <circle cx="34" cy="30" r="1.4" fill="#ff6b1a"/>
    </svg>
    <strong>Fla<span>map</span></strong>
  </a>
  <a href="/">Voir la carte</a>
</header>

<main>
  <div id="loading" role="status">Préparation des dernières données…</div>
  <div id="error" hidden></div>

  <div id="content" class="layout" hidden>
    <section class="preview" aria-labelledby="preview-title">
      <h2 id="preview-title" class="sr-only">Aperçu de l’image</h2>
      <canvas id="card" width="1200" height="675" role="img"></canvas>
      <p id="canvas-description" class="sr-only"></p>
    </section>

    <section class="editor" aria-label="Contenu de la publication">
      <div class="field">
        <div class="field-head">
          <label for="post">Texte de la publication</label>
          <span id="counter">0 / 280</span>
        </div>
        <textarea id="post" maxlength="280"></textarea>
      </div>

      <div class="field">
        <div class="field-head">
          <label for="alt">Description de l’image</label>
          <span>à ajouter dans « ALT »</span>
        </div>
        <textarea id="alt" maxlength="1000"></textarea>
      </div>

      <div class="actions">
        <button id="copy" type="button">Copier le texte</button>
        <button id="download" type="button">Télécharger le PNG</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </div>
</main>

<script>
const DAY = 86400;
const nf = new Intl.NumberFormat('fr-FR');
const longDate = new Intl.DateTimeFormat('fr-FR', {
  dateStyle: 'long', timeStyle: 'short', timeZone: 'Europe/Paris'
});
const shortDate = new Intl.DateTimeFormat('fr-FR', {
  day: 'numeric', month: 'short', timeZone: 'Europe/Paris'
});

const loading = document.getElementById('loading');
const error = document.getElementById('error');
const content = document.getElementById('content');
const post = document.getElementById('post');
const alt = document.getElementById('alt');
const counter = document.getElementById('counter');
const status = document.getElementById('status');
const canvas = document.getElementById('card');
const ctx = canvas.getContext('2d');

let imageName = 'flamap.png';

function countBetween(passages, start, end) {
  return passages.reduce((sum, step) =>
    step.ts > start && step.ts <= end ? sum + step.n : sum, 0);
}

function variation(current, previous) {
  if (!previous) return current ? ' ; aucune détection durant les 24 h précédentes' : '';
  const signed = Math.round((current - previous) / previous * 100);
  if (signed === 0) return ', un niveau stable par rapport aux 24 h précédentes';
  return `, soit ${signed > 0 ? '+' : '−'}${Math.abs(signed)} % par rapport aux 24 h précédentes`;
}

function variationLabel(current, previous) {
  if (!previous) return current ? 'Après 24 h sans détection' : 'Niveau stable';
  const signed = Math.round((current - previous) / previous * 100);
  if (!signed) return 'Stable sur 24 h';
  return `${signed > 0 ? '+' : '−'}${Math.abs(signed)} % par rapport aux 24 h précédentes`;
}

function activitySeries(passages, latest) {
  const start = latest - 6 * DAY;
  const points = [];
  const bin = 6 * 3600;
  for (let end = start + bin; end <= latest; end += bin) {
    points.push({
      ts: end,
      raw: countBetween(passages, end - bin, end),
      rolling: countBetween(passages, end - DAY, end),
    });
  }
  return points;
}

function drawCard(current, previous, latest, series) {
  const W = canvas.width, H = canvas.height;
  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#121418');
  bg.addColorStop(.72, '#0d0f12');
  bg.addColorStop(1, '#1c120e');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const glow = ctx.createRadialGradient(1110, 40, 0, 1110, 40, 360);
  glow.addColorStop(0, '#ff6b1a1d');
  glow.addColorStop(1, '#ff6b1a00');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = '#b1341f';
  ctx.beginPath(); ctx.arc(51, 49, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ff6b1a';
  ctx.beginPath(); ctx.arc(65, 49, 10.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd84d';
  ctx.beginPath(); ctx.arc(84.6, 49, 14, 0, Math.PI * 2); ctx.fill();
  ctx.font = '700 27px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#ff6b1a';
  ctx.fillText('Fla', 112, 59);
  const fla = ctx.measureText('Fla').width;
  ctx.fillStyle = '#e8e6e3';
  ctx.fillText('map', 112 + fla, 59);

  const countText = nf.format(current);
  const titleSize = countText.length > 5 ? 40 : countText.length > 3 ? 44 : 48;
  ctx.font = `700 ${titleSize}px system-ui, -apple-system, sans-serif`;
  ctx.fillStyle = '#fff3b8';
  ctx.fillText(countText, 58, 128);
  const countWidth = ctx.measureText(countText).width;
  ctx.fillStyle = '#e8e6e3';
  ctx.fillText(current === 1 ? ' détection de foyer en France' : ' détections de foyers en France',
               58 + countWidth, 128);
  ctx.font = '500 27px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#a8a29c';
  ctx.fillText(`en 24 h, contre ${nf.format(previous)} lors des 24 h précédentes`, 58, 169);

  const x0 = 58, y0 = 207, chartW = 1084, chartH = 341;

  const values = series.flatMap(point => [point.raw, point.rolling]);
  const max = Math.max(...values, 1) * 1.12;
  const py = value => y0 + chartH - value / max * (chartH - 18);
  const stepW = chartW / series.length;
  const px = index => x0 + (index + .5) * stepW;

  ctx.lineWidth = 1;
  ctx.strokeStyle = '#2c3035';
  for (let i = 0; i < 4; i++) {
    const y = y0 + i * chartH / 3;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + chartW, y); ctx.stroke();
  }

  series.forEach((point, index) => {
    const h = y0 + chartH - py(point.raw);
    ctx.fillStyle = index >= series.length - 4 ? '#b84a24aa' : '#7d382477';
    ctx.fillRect(x0 + index * stepW + 2, y0 + chartH - h,
                 Math.max(stepW - 4, 2), h);
  });

  ctx.beginPath();
  series.forEach((point, index) => {
    const x = px(index), y = py(point.rolling);
    if (index) ctx.lineTo(x, y); else ctx.moveTo(x, y);
  });
  ctx.strokeStyle = '#ffd84d';
  ctx.lineWidth = 4;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.stroke();

  const previousIndex = series.length - 5;
  const annotations = [
    {index: previousIndex, value: previous},
    {index: series.length - 1, value: current},
  ];
  ctx.font = '650 16px system-ui, -apple-system, sans-serif';
  annotations.forEach(({index, value}) => {
    const x = px(index), y = py(value);
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fillStyle = '#fff3b8';
    ctx.fill();
    ctx.textAlign = index === series.length - 1 ? 'right' : 'center';
    ctx.fillStyle = '#fff3b8';
    ctx.fillText(nf.format(value), index === series.length - 1 ? x - 10 : x,
                 Math.max(y - 13, y0 + 17));
  });

  ctx.font = '500 16px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#8f8b86';
  ctx.textAlign = 'left';
  ctx.fillText(shortDate.format(new Date(series[0].ts * 1000)), x0, 583);
  ctx.textAlign = 'center';
  ctx.fillText(shortDate.format(new Date(series[Math.floor(series.length / 2)].ts * 1000)),
               x0 + chartW / 2, 583);
  ctx.textAlign = 'right';
  ctx.fillText(shortDate.format(new Date(latest * 1000)), x0 + chartW, 583);

  ctx.textAlign = 'left';
  ctx.font = '500 15px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#a84a2e';
  ctx.fillRect(385, 612, 18, 11);
  ctx.fillStyle = '#a8a29c';
  ctx.fillText('Détections par 6 h', 414, 622);
  ctx.strokeStyle = '#ffd84d';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(638, 617); ctx.lineTo(661, 617); ctx.stroke();
  ctx.fillText('Total glissant sur 24 h', 673, 622);

  ctx.font = '500 16px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#88837e';
  ctx.fillText('Source : NASA FIRMS · flamap.fr', 66, 650);
  ctx.textAlign = 'right';
  ctx.fillText(`Dernière observation : ${longDate.format(new Date(latest * 1000))}`, 1134, 650);
  ctx.textAlign = 'left';
}

function updateCounter() {
  counter.textContent = `${post.value.length} / 280`;
  counter.style.color = post.value.length > 260 ? '#ffb6a1' : '';
}

async function copyText() {
  try {
    await navigator.clipboard.writeText(post.value);
  } catch (_) {
    post.focus();
    post.select();
    document.execCommand('copy');
  }
  status.textContent = 'Texte copié.';
}

function downloadImage() {
  canvas.toBlob(blob => {
    if (!blob) {
      status.textContent = 'Le PNG n’a pas pu être généré.';
      return;
    }
    const link = document.createElement('a');
    link.download = imageName;
    link.href = URL.createObjectURL(blob);
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
    status.textContent = 'PNG téléchargé.';
  }, 'image/png');
}

fetch('data/timeline.json').then(response => {
  if (!response.ok) throw new Error(`frise indisponible (${response.status})`);
  return response.json();
}).then(timeline => {
  const passages = timeline
    .filter(step => step.kind === 'sat' && Number.isFinite(step.ts) && Number.isFinite(step.n))
    .sort((a, b) => a.ts - b.ts);
  if (!passages.length) throw new Error('aucun passage satellite exploitable');

  const latest = passages[passages.length - 1].ts;
  const current = countBetween(passages, latest - DAY, latest);
  const previous = countBetween(passages, latest - 2 * DAY, latest - DAY);
  const series = activitySeries(passages, latest);
  if (series.length < 2) throw new Error('historique insuffisant pour tracer la courbe');

  const noun = current === 1 ? 'détection de foyer relevée' : 'détections de foyers relevées';
  post.value = `🔥 ${nf.format(current)} ${noun} en France par satellite au cours des dernières 24 h${variation(current, previous)}.\n\nCarte actualisée : https://flamap.fr/`;
  alt.value = `Graphique Flamap montrant ${nf.format(current)} ${current === 1 ? 'détection' : 'détections'} de foyers en France au cours des dernières 24 heures, contre ${nf.format(previous)} durant les 24 heures précédentes. ${variationLabel(current, previous)}. Les barres représentent les détections par tranche de six heures et la ligne leur total glissant sur 24 heures.`;

  drawCard(current, previous, latest, series);
  const description = alt.value;
  canvas.setAttribute('aria-label', description);
  document.getElementById('canvas-description').textContent = description;
  const date = new Date(latest * 1000).toISOString().slice(0, 16).replace(/[:T]/g, '-');
  imageName = `flamap-${date}.png`;
  updateCounter();

  loading.hidden = true;
  content.hidden = false;
}).catch(reason => {
  loading.hidden = true;
  error.hidden = false;
  error.textContent = `Impossible de préparer la publication : ${reason.message}.`;
});

post.addEventListener('input', updateCounter);
document.getElementById('copy').addEventListener('click', copyText);
document.getElementById('download').addEventListener('click', downloadImage);
</script>
</body>
</html>
